<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kontinuum-engine README banner</title>
<style>
  /* No webfont on purpose: the project's own stack is ui-monospace / SF Mono,
     so Chrome resolves here exactly what a reader resolves on kontinuum.audio. */
  html, body { margin: 0; padding: 0; width: 1280px; height: 440px; overflow: hidden; }
  body {
    background: #0B0B0D; color: #D9D9D9;
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    box-sizing: border-box; padding: 0 70px;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(30% 56% at 26% 30%, rgba(255,59,48,.15), transparent 68%),
      radial-gradient(30% 56% at 74% 30%, rgba(255,159,10,.13), transparent 68%),
      radial-gradient(40% 60% at 50% 118%, rgba(255,90,40,.10), transparent 70%);
  }
  /* A render is a pure function of (session, seed): the waveform under the mark
     is one deterministic cycle, drawn the same way every time. */
  .wave { position: absolute; left: 0; right: 0; top: 50%; height: 180px; transform: translateY(-50%); opacity: .10; }
  .mark { position: relative; width: 190px; height: 139px; margin-bottom: 14px; }
  .word {
    position: relative; font-size: 38px; font-weight: 600; letter-spacing: .34em;
    line-height: 1; margin: 0; text-indent: .34em; color: #ECEBE6; white-space: nowrap;
  }
  .tag { position: relative; font-size: 15px; letter-spacing: .1em; color: rgba(255,255,255,.42); margin: 20px 0 0; }
  .meta { position: relative; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.24); margin: 24px 0 0; }
  .meta b { color: #FF3B30; font-weight: 400; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #FF3B30, #FF6D1D 46%, #FF9F0A); }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="wave" viewBox="0 0 1280 180" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 90 C 40 20, 80 160, 120 90 S 200 20, 240 90 S 320 160, 360 90 S 440 20, 480 90 S 560 160, 600 90 S 680 20, 720 90 S 800 160, 840 90 S 920 20, 960 90 S 1040 160, 1080 90 S 1160 20, 1200 90 S 1280 160, 1320 90"
          fill="none" stroke="#FF6D1D" stroke-width="2"/>
  </svg>
  <img class="mark" src="../assets/mark.svg" alt="">
  <p class="word">KONTINUUM ENGINE</p>
  <p class="tag">A deterministic, real-time music engine in Rust.</p>
  <p class="meta">music as code &nbsp;&middot;&nbsp; ir-first &nbsp;&middot;&nbsp; <b>bit-identical renders</b> &nbsp;&middot;&nbsp; mit</p>
  <div class="rule"></div>
</body>
</html>
